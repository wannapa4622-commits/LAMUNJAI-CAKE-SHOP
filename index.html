<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍰 Bakery Hub - ระบบร้านขนมเค้กออนไลน์ครบวงจร</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for Admin Sales Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Kanit & Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'Prompt', 'sans-serif'],
                    },
                    colors: {
                        cake: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            pastelPink: '#ffccd5',
                            pastelCream: '#fff3e2',
                            pastelBrown: '#8d6e63',
                            darkBrown: '#4e342e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fffaf0; color: #4e342e; }
        .pastel-shadow { box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.1), 0 8px 10px -6px rgba(244, 63, 94, 0.1); }
        .cake-card { transition: all 0.3s ease; }
        .cake-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -3px rgba(141, 110, 99, 0.15); }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #fff3e2; }
        ::-webkit-scrollbar-thumb { background: #fca4af; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f43f5e; }
    </style>
</head>
<body class="h-full flex flex-col justify-between selection:bg-cake-200 selection:text-cake-900">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none"></div>

    <!-- Top Navigation Bar / Header -->
    <header class="bg-white border-b border-cake-100 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('home')">
                <div class="w-10 h-10 rounded-full bg-cake-100 flex items-center justify-center text-cake-600 text-xl shadow-inner">
                    <i class="fa-solid fa-cake-candles"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-cake-darkBrown leading-tight">BakeHub <span class="text-xs px-2 py-0.5 bg-cake-100 text-cake-600 rounded-full font-normal">ระบบร้านเค้กออนไลน์</span></h1>
                    <p class="text-xs text-stone-500" id="current-user-badge">ยังไม่ได้เข้าสู่ระบบ</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div id="nav-actions" class="flex items-center space-x-2">
                    <!-- Dynamic Auth / Role buttons injected via JS -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main id="main-content" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Dynamic Views rendered here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-cake-100 mt-12 py-6 text-center text-xs text-stone-500">
        <p>© 2026 BakeHub Online Cake System. All rights reserved. | ออกแบบด้วยธีมพาสเทลแสนหวานอบอุ่น 🍰✨</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // --- MOCK DATABASE & INITIAL STATE ---
        const DEFAULT_STATE = {
            currentUser: null,
            cakes: [
                { id: 1, name: 'สตรอว์เบอร์รีชีสเค้กละมุน', price: 450, category: 'birthday', weight: 1.2, image: 'https://placehold.co/400x300/ffe4e6/e11d48?text=Strawberry+Cheese+Cake', desc: 'ชีสเค้กเนื้อเนียนนุ่มท็อปด้วยสตรอว์เบอร์รีสดและซอสสูตรพิเศษ' },
                { id: 2, name: 'ดับเบิ้ลช็อกโกแลตฟัดจ์', price: 520, category: 'chocolate', weight: 1.5, image: 'https://placehold.co/400x300/f3e8ff/7e22ce?text=Chocolate+Fudge+Cake', desc: 'ช็อกโกแลตเข้มข้นสอดไส้กานาชละลายในปาก เอาใจคนรักช็อกโกแลต' },
                { id: 3, name: 'เค้กวนิลลามะพร้าวอ่อน', price: 390, category: 'birthday', weight: 1.0, image: 'https://placehold.co/400x300/fef3c7/d97706?text=Coconut+Vanilla+Cake', desc: 'เค้กนมสดเนื้อชิฟฟอนพร้อมเนื้อมะพร้าวอ่อนแท้หอมหวานกำลังดี' },
                { id: 4, name: 'บลูเบอร์รีเรดเวลเวท', price: 480, category: 'wedding', weight: 1.3, image: 'https://placehold.co/400x300/ccfbf1/0f766e?text=Red+Velvet+Cake', desc: 'เรดเวลเวทรสชาติกลมกล่อมตัดเปรี้ยวด้วยบลูเบอร์รีคอมพอท' }
            ],
            ingredients: {
                sizes: [
                    { name: '1 ปอนด์ (เล็ก - 15 ซม.)', price: 0, weight: 1.0 },
                    { name: '2 ปอนด์ (กลาง - 20 ซม.)', price: 250, weight: 1.8 },
                    { name: '3 ปอนด์ (ใหญ่ - 25 ซม.)', price: 500, weight: 2.7 }
                ],
                bases: [
                    { name: 'เนื้อวนิลลาชิฟฟอน (Vanilla Chiffon)', price: 0, weight: 0 },
                    { name: 'เนื้อช็อกโกแลต (Chocolate Sponge)', price: 40, weight: 0.1 },
                    { name: 'เนื้อเรดเวลเวท (Red Velvet)', price: 60, weight: 0.1 }
                ],
                creams: [
                    { name: 'ครีมนมสดฮอกไกโด (Hokkaido Fresh Cream)', price: 0, weight: 0.2 },
                    { name: 'บัตเตอร์ครีมวานิลลา (Vanilla Buttercream)', price: 30, weight: 0.3 },
                    { name: 'ครีมชีสฟรอสติ้ง (Cream Cheese Frosting)', price: 50, weight: 0.3 }
                ],
                toppings: [
                    { name: 'สตรอว์เบอร์รีสด (Fresh Strawberries)', price: 80, weight: 0.2 },
                    { name: 'มาการองคละสี (Assorted Macarons)', price: 100, weight: 0.15 },
                    { name: 'ช็อกโกแลตหนาแน่น (Dark Choco Ganache)', price: 70, weight: 0.2 },
                    { name: 'ผลไม้รวมตามฤดูกาล (Mixed Seasonal Fruits)', price: 90, weight: 0.25 }
                ]
            },
            drivers: [
                { id: 'd1', name: 'พี่สมชาย ใจดี', phone: '0812345678', vehicle: 'มอเตอร์ไซค์ (กข 1234)', active: true },
                { id: 'd2', name: 'พี่มาโนช ว่องไว', phone: '0898765432', vehicle: 'มอเตอร์ไซค์ (ฮฮ 5678)', active: true }
            ],
            orders: [
                {
                    id: 'ORD-2026-001',
                    customerName: 'คุณน้ำหวาน ใจดี',
                    customerPhone: '0891112233',
                    items: [{ name: 'สตรอว์เบอร์รีชีสเค้กละมุน', qty: 1, price: 450 }],
                    totalPrice: 450,
                    status: 'pending',
                    address: '123/4 ถ.พหลโยธิน จตุจักร กรุงเทพฯ',
                    note: 'ขอเทียนวันเกิด 2 เล่มครับ',
                    driverId: null,
                    createdAt: '2026-06-01 10:30'
                }
            ],
            cart: []
        };

        let appState = JSON.parse(localStorage.getItem('bakehub_state')) || DEFAULT_STATE;

        function saveState() {
            localStorage.setItem('bakehub_state', JSON.stringify(appState));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-rose-500' : 'bg-amber-500';
            toast.className = `${bgCol} text-white px-4 py-3 rounded-xl shadow-lg pointer-events-auto flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let currentView = 'home';

        function switchView(viewName) {
            currentView = viewName;
            renderHeaderActions();
            const main = document.getElementById('main-content');
            main.innerHTML = '';

            if (viewName === 'home') renderHomeView(main);
            else if (viewName === 'custom-cake') renderCustomCakeView(main);
            else if (viewName === 'cart') renderCartView(main);
            else if (viewName === 'customer-orders') renderCustomerOrdersView(main);
            else if (viewName === 'admin-dashboard') renderAdminDashboardView(main);
            else if (viewName === 'driver-portal') renderDriverPortalView(main);
            else if (viewName === 'login') renderLoginView(main);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderHeaderActions() {
            const badge = document.getElementById('current-user-badge');
            const actions = document.getElementById('nav-actions');
            actions.innerHTML = '';

            if (!appState.currentUser) {
                badge.innerText = 'ยังไม่ได้เข้าสู่ระบบ';
                actions.innerHTML = `
                    <button onclick="switchView('login')" class="px-3 py-1.5 text-sm bg-cake-100 text-cake-600 rounded-xl hover:bg-cake-200 font-medium transition"><i class="fa-solid fa-right-to-bracket mr-1"></i> เข้าสู่ระบบ</button>
                    <button onclick="switchView('cart')" class="relative px-3 py-1.5 text-sm bg-cake-500 text-white rounded-xl hover:bg-cake-600 shadow-sm transition"><i class="fa-solid fa-cart-shopping"></i> <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-400 text-stone-900 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">${appState.cart.length}</span></button>
                `;
            } else {
                const user = appState.currentUser;
                badge.innerHTML = `<span class="font-semibold text-cake-600">${user.name}</span> (${user.role === 'admin' ? 'ผู้ดูแลร้าน' : user.role === 'driver' ? 'พนักงานส่ง' : 'ลูกค้า'})`;
                
                let viewBtns = '';
                if (user.role === 'customer') {
                    viewBtns = `
                        <button onclick="switchView('home')" class="px-3 py-1.5 text-sm bg-amber-100 text-amber-800 rounded-xl hover:bg-amber-200 transition">หน้าแรก</button>
                        <button onclick="switchView('custom-cake')" class="px-3 py-1.5 text-sm bg-cake-100 text-cake-600 rounded-xl hover:bg-cake-200 transition">🍰 ออกแบบเค้ก</button>
                        <button onclick="switchView('customer-orders')" class="px-3 py-1.5 text-sm bg-stone-100 text-stone-700 rounded-xl hover:bg-stone-200 transition">📦 ประวัติคำสั่งซื้อ</button>
                        <button onclick="switchView('cart')" class="relative px-3 py-1.5 text-sm bg-cake-500 text-white rounded-xl hover:bg-cake-600 transition"><i class="fa-solid fa-cart-shopping"></i> <span class="absolute -top-1 -right-1 bg-amber-400 text-stone-900 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">${appState.cart.length}</span></button>
                    `;
                } else if (user.role === 'admin') {
                    viewBtns = `<button onclick="switchView('admin-dashboard')" class="px-3 py-1.5 text-sm bg-cake-600 text-white rounded-xl hover:bg-cake-700 transition"><i class="fa-solid fa-chart-line mr-1"></i> แผงควบคุมร้าน</button>`;
                } else if (user.role === 'driver') {
                    viewBtns = `<button onclick="switchView('driver-portal')" class="px-3 py-1.5 text-sm bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 transition"><i class="fa-solid fa-motorcycle mr-1"></i> งานจัดส่ง</button>`;
                }

                actions.innerHTML = `
                    ${viewBtns}
                    <button onclick="logout()" class="px-3 py-1.5 text-sm bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition" title="ออกจากระบบ"><i class="fa-solid fa-power-off"></i></button>
                `;
            }
        }

        // --- VIEWS ---

        function renderHomeView(container) {
            container.innerHTML = `
                <div class="bg-gradient-to-r from-cake-100 via-pink-50 to-amber-50 rounded-3xl p-8 mb-8 pastel-shadow flex flex-col md:flex-row items-center justify-between">
                    <div class="max-w-lg mb-6 md:mb-0">
                        <span class="px-3 py-1 bg-cake-200 text-cake-700 rounded-full text-xs font-semibold uppercase tracking-wider">เบเกอรี่โฮมเมด สดใหม่ทุกวัน</span>
                        <h2 class="text-3xl md:text-4xl font-extrabold text-cake-darkBrown mt-3 mb-2">เค้กอร่อยละมุนลิ้น ส่งตรงถึงหน้าบ้านคุณ 🍰</h2>
                        <p class="text-stone-600 text-sm md:text-base mb-6">เลือกเค้กวันเกิด เค้กวันพิเศษ หรือออกแบบเค้กในสไตล์คุณเองได้ง่ายๆ พร้อมระบบติดตามสถานะแบบเรียลไทม์</p>
                        <button onclick="switchView('custom-cake')" class="px-6 py-3 bg-cake-500 text-white rounded-2xl font-semibold shadow-lg hover:bg-cake-600 transition flex items-center space-x-2">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span>ออกแบบเค้กตามใจชอบ</span>
                        </button>
                    </div>
                    <div class="w-full md:w-80 h-56 rounded-2xl overflow-hidden shadow-md bg-white flex items-center justify-center p-2">
                        <img src="https://placehold.co/500x400/ffe4e6/e11d48?text=BakeHub+Fresh+Cakes" alt="Cake Hero" class="w-full h-full object-cover rounded-xl">
                    </div>
                </div>

                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold text-cake-darkBrown"><i class="fa-solid fa-store mr-2 text-cake-500"></i>เมนูเค้กยอดนิยม</h3>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="cake-catalog"></div>
            `;

            const catalog = document.getElementById('cake-catalog');
            appState.cakes.forEach(cake => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl overflow-hidden border border-cake-100 cake-card flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="h-48 overflow-hidden bg-stone-100 relative">
                            <img src="${cake.image}" alt="${cake.name}" class="w-full h-full object-cover">
                            <span class="absolute top-3 right-3 bg-white/90 backdrop-blur text-cake-600 px-2.5 py-1 rounded-full text-xs font-bold shadow-sm">${cake.weight} ปอนด์</span>
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-stone-800 text-base mb-1">${cake.name}</h4>
                            <p class="text-xs text-stone-500 line-clamp-2 mb-3">${cake.desc}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between">
                        <span class="text-lg font-extrabold text-cake-600">฿${cake.price}</span>
                        <button onclick="addToCartCatalog(${cake.id})" class="px-4 py-2 bg-cake-100 text-cake-600 hover:bg-cake-500 hover:text-white rounded-xl text-sm font-semibold transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-cart-plus"></i>
                            <span>ใส่ตะกร้า</span>
                        </button>
                    </div>
                `;
                catalog.appendChild(card);
            });
        }

        function addToCartCatalog(cakeId) {
            const cake = appState.cakes.find(c => c.id === cakeId);
            if (!cake) return;
            appState.cart.push({
                name: cake.name,
                price: cake.price,
                qty: 1,
                detail: `เค้กมาตรฐาน (${cake.weight} ปอนด์)`
            });
            saveState();
            renderHeaderActions();
            showToast(`เพิ่ม "${cake.name}" ลงในตะกร้าแล้วค่ะ 🍰`);
        }

        function renderCustomCakeView(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white rounded-3xl p-6 md:p-8 border border-cake-100 pastel-shadow">
                    <div class="text-center mb-8">
                        <span class="px-3 py-1 bg-cake-100 text-cake-600 rounded-full text-xs font-semibold">DIY Cake Studio</span>
                        <h2 class="text-2xl md:text-3xl font-extrabold text-cake-darkBrown mt-2">ออกแบบเค้กในฝันของคุณเอง</h2>
                        <p class="text-stone-500 text-sm mt-1">เลือกขนาด เนื้อเค้ก ครีม และท็อปปิ้งได้ตามใจชอบ คำนวณราคาและน้ำหนักให้อัตโนมัติ</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-6">
                            <div>
                                <label class="block text-sm font-bold text-stone-700 mb-2">1. ขนาดเค้ก (ปอนด์)</label>
                                <select id="custom-size" onchange="calculateCustomCake()" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-cake-400 bg-stone-50 text-sm">
                                    ${appState.ingredients.sizes.map((s, idx) => `<option value="${idx}">${s.name} (+฿${s.price})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-stone-700 mb-2">2. เนื้อเค้ก (Base)</label>
                                <select id="custom-base" onchange="calculateCustomCake()" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-cake-400 bg-stone-50 text-sm">
                                    ${appState.ingredients.bases.map((b, idx) => `<option value="${idx}">${b.name} (+฿${b.price})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-stone-700 mb-2">3. ครีมเคลือบ/ฟรอสติ้ง (Cream)</label>
                                <select id="custom-cream" onchange="calculateCustomCake()" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-cake-400 bg-stone-50 text-sm">
                                    ${appState.ingredients.creams.map((c, idx) => `<option value="${idx}">${c.name} (+฿${c.price})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-stone-700 mb-2">4. ท็อปปิ้งตกแต่ง (Topping)</label>
                                <select id="custom-topping" onchange="calculateCustomCake()" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-cake-400 bg-stone-50 text-sm">
                                    ${appState.ingredients.toppings.map((t, idx) => `<option value="${idx}">${t.name} (+฿${t.price})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-stone-700 mb-2">5. ข้อความบนหน้าเค้ก (ถ้ามี)</label>
                                <input type="text" id="custom-message" placeholder="เช่น Happy Birthday Namwan" class="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-cake-400 bg-stone-50 text-sm">
                            </div>
                        </div>

                        <div class="bg-cake-50/60 rounded-2xl p-6 flex flex-col justify-between border border-cake-100">
                            <div>
                                <h3 class="font-bold text-stone-800 text-lg mb-4 flex items-center"><i class="fa-solid fa-receipt mr-2 text-cake-500"></i>สรุปรายการเค้กที่คุณออกแบบ</h3>
                                <div id="custom-summary-list" class="space-y-3 text-sm text-stone-600 mb-6"></div>
                            </div>
                            <div class="border-t border-cake-200 pt-4">
                                <div class="flex justify-between items-center mb-2 text-sm text-stone-500">
                                    <span>น้ำหนักโดยประมาณ:</span>
                                    <span id="custom-weight" class="font-semibold text-stone-700">1.2 กก.</span>
                                </div>
                                <div class="flex justify-between items-center mb-6">
                                    <span class="text-base font-bold text-stone-800">ราคารวมทั้งสิ้น:</span>
                                    <span id="custom-total-price" class="text-2xl font-extrabold text-cake-600">฿350</span>
                                </div>
                                <button onclick="addCustomCakeToCart()" class="w-full py-3 bg-cake-500 hover:bg-cake-600 text-white rounded-2xl font-bold shadow-md transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-cart-plus"></i>
                                    <span>เพิ่มเค้กออกแบบเองลงตะกร้า</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            calculateCustomCake();
        }

        function calculateCustomCake() {
            const sizeIdx = document.getElementById('custom-size').value;
            const baseIdx = document.getElementById('custom-base').value;
            const creamIdx = document.getElementById('custom-cream').value;
            const toppingIdx = document.getElementById('custom-topping').value;

            const size = appState.ingredients.sizes[sizeIdx];
            const base = appState.ingredients.bases[baseIdx];
            const cream = appState.ingredients.creams[creamIdx];
            const topping = appState.ingredients.toppings[toppingIdx];

            const basePrice = 350;
            const totalPrice = basePrice + size.price + base.price + cream.price + topping.price;
            const totalWeight = (1.0 + size.weight + base.weight + cream.weight + topping.weight).toFixed(1);

            document.getElementById('custom-total-price').innerText = `฿${totalPrice}`;
            document.getElementById('custom-weight').innerText = `${totalWeight} กก.`;

            document.getElementById('custom-summary-list').innerHTML = `

                <div class="flex justify-between"><span>• ท็อปปิ้ง:</span> <span class="font-medium text-stone-800">${topping.name}</span></div>
            `;

            window.lastCalculatedCustomCake = {
                name: `เค้กออกแบบเอง (${size.name.split(' ')[0]})`,
                price: totalPrice,
                qty: 1,
                detail: `เนื้อ: ${base.name} | ครีม: ${cream.name} | ท็อปปิ้ง: ${topping.name}` + (document.getElementById('custom-message').value ? ` | ข้อความ: "${document.getElementById('custom-message').value}"` : '')

        function checkoutOrder() {

            const address = document.getElementById('checkout-address').value.trim();
            const note = document.getElementById('checkout-note').value.trim();

                return;
            }

            const totalPrice = appState.cart.reduce((sum, item) => sum + item.price, 0);
            const newOrder = {
                id: `ORD-2026-${Math.floor(100 + Math.random() * 900)}`,
                customerName: name,
                customerPhone: phone,
                items: [...appState.cart],
                totalPrice: totalPrice,
                status: 'pending',
                address: address,
                note: note || '-',
                driverId: null,
                createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16)

            appState.orders.unshift(newOrder);
            appState.cart = [];
            saveState();
            renderHeaderActions();

                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-stone-400 text-sm"><i class="fa-solid fa-key"></i></span>
                                <input type="password" id="login-password" placeholder="••••••••" required class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-stone-200 text-sm bg-stone-50 focus:bg-white focus:ring-2 focus:ring-cake-400 focus:outline-none transition">
                            </div>
                        </div>

                        <button type="submit" class="w-full py-3 bg-cake-500 hover:bg-cake-600 text-white rounded-2xl font-bold shadow-md transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>เข้าสู่ระบบ</span>
                        </button>
                    </form>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-stone-100"></div>
                        <span class="flex-shrink mx-4 text-xs text-stone-400 font-medium">หรือทดลองเข้าสู่ระบบด่วน</span>
                        <div class="flex-grow border-t border-stone-100"></div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mt-4">
                        <button onclick="loginAs('customer')" class="py-2 px-1 bg-stone-50 hover:bg-cake-50 text-stone-700 hover:text-cake-600 rounded-xl text-xs font-semibold border border-stone-100 transition flex flex-col items-center">
                            <i class="fa-solid fa-user mb-1 text-cake-500"></i> ลูกค้า
                        </button>
                        <button onclick="loginAs('admin')" class="py-2 px-1 bg-stone-50 hover:bg-cake-50 text-stone-700 hover:text-cake-600 rounded-xl text-xs font-semibold border border-stone-100 transition flex flex-col items-center">
                            <i class="fa-solid fa-user-shield mb-1 text-cake-500"></i> แอดมิน
                        </button>
                        <button onclick="loginAs('driver')" class="py-2 px-1 bg-stone-50 hover:bg-cake-50 text-stone-700 hover:text-cake-600 rounded-xl text-xs font-semibold border border-stone-100 transition flex flex-col items-center">
                            <i class="fa-solid fa-motorcycle mb-1 text-cake-500"></i> ไรเดอร์
                        </button>
                    </div>
                </div>
            `;
        }

        function handleCustomLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            // ตรวจสอบตามเบอร์โทรศัพท์เพื่อแยกบทบาทจำลอง
            if (phone.startsWith('082') || phone === '0823334455') {
                loginAs('admin');
            } else if (phone.startsWith('081') || phone === '0812345678') {
                loginAs('driver');
            } else {
                appState.currentUser = { name: 'คุณลูกค้าคนพิเศษ', phone: phone, role: 'customer' };
                saveState();
                switchView('home');
                showToast('เข้าสู่ระบบสำเร็จ ยินดีต้อนรับค่ะ 🍰');
            }
        }

        function loginAs(role) {
            if (role === 'customer') {
                appState.currentUser = { name: 'คุณน้ำหวาน ใจดี', phone: '0891112233', role: 'customer' };
                switchView('home');
            } else if (role === 'admin') {
                appState.currentUser = { name: 'คุณเบเกอร์ (เจ้าของร้าน)', phone: '0823334455', role: 'admin' };
                switchView('admin-dashboard');
            } else if (role === 'driver') {
                appState.currentUser = { name: 'พี่สมชาย ใจดี', phone: '0812345678', role: 'driver' };
                switchView('driver-portal');
            }
            saveState();
            showToast(`เข้าสู่ระบบสำเร็จ (${appState.currentUser.name})`);
        }

        function logout() {
            appState.currentUser = null;
            saveState();
            switchView('home');
            showToast('ออกจากระบบเรียบร้อยแล้วค่ะ');
        }

        window.addEventListener('DOMContentLoaded', () => {
            switchView('home');
        });
    </script>
</body>
</html>
